name: Container evaluator integration (synthetic only)

on:
  push:
    branches: [codex/connect-container-evaluator]
  pull_request:
    paths:
      - scripts/evaluator/**
      - tests/evaluator-container-task.test.js
      - .github/workflows/container-integration.yml

permissions:
  contents: read

jobs:
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Prepare the exact official runtime image
        run: docker pull node:24.21.0-bookworm-slim@sha256:5cbc7caba8c2c0f0bca675d1b61b9f2857e1cf1853c6164ee9dd409501a936e7
      - name: Prove synthetic containment, verdict checks, and cleanup
        env:
          FOCUSTRACK_CONTAINER_TESTS: '1'
        run: node --test tests/evaluator-container-task.test.js
